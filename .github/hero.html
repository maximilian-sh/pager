<!doctype html>
<!--
  Quelle für hero.png. Neu rendern mit:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --screenshot=.github/hero.png --window-size=2400,1000 \
      --default-background-color=FFFFFF \
      "file://$PWD/.github/hero.html"

  Das Icon kommt direkt aus docs/ — eine Quelle, kein Nachbau.
-->
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2400px; height: 1000px; }
  body {
    background: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Die Icon-Datei bringt reichlich eigenen Rand mit — deshalb deutlich
     grösser gesetzt, als die sichtbare Grafik am Ende wirkt. */
  .icon { width: 540px; height: 540px; margin-bottom: -20px; }

  h1 {
    font-size: 232px; font-weight: 600; letter-spacing: -0.045em;
    color: #111; line-height: 1;
  }
</style>

<img class="icon" src="../docs/icon-512.png" alt="">
<h1>pager</h1>
